<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web design</title>
</head>
<style>
    body{
        margin: 0;
        padding: 0;
    }
    .hd{
            background-color: pink;
            color: black;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
    }
    .nv{
        background-color: aqua;
        color: black;
        margin: 20px 0;
        padding: 15px;
        border-radius: 20px;
        text-align: center;
    }
    .content {
      display: flex;
      gap: 15px;
      margin-bottom: 12px;
    }
    .mn{
      background-color: #163009;
      padding: 35px;
      width: 65%;
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }   
    .arc{
        text-align: center;
        background-color: tomato;
        padding: 40px;
    }
    .sc{
        background-color: rgb(182, 133, 228);
        padding: 40px;
        margin: 10px 0;
        text-align: center;
    }
    .as{
      background-color: #8cc4f8;
      color: black;
      padding: 25px;
      width: 35%;
      border-radius: 15px;
      text-align: center;
    }
    .ft{
      background-color: #83d6c5;
      color: black;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }
</style>
<body>
    <header class="hd">
        <h1>This is header</h1>
    </header>

    <nav class="nv">
        <h2>This is nav</h2>
    </nav>
    <div class="content">
    <main class="mn"> 
        <h1>main</h1>
        <article class="arc">
        <h1>This is article</h1>
        </article>
        <section class="sc">
            <h1>Section</h1>
        </section>
    </main>

    <aside class="as">
        <h1>aside</h1>
    </aside>
</div>
<footer class="ft">
    <h1>
        Footer
    </h1>
</footer>
</body>
</html>
